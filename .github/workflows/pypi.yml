# Builds the sdist and wheel and publishes them to PyPI with trusted publishing (OIDC, no API tokens).
# Run by hand: Actions → "Publish to PyPI" → Run workflow. See PACKAGING.md.
# Needs a trusted publisher on PyPI for this repo, workflow "pypi.yml" and environment "pypi".
name: Publish to PyPI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pypi
  cancel-in-progress: false   # never stop an upload halfway

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Check the upload guard
        run: |
          if grep -q '"Private :: Do Not Upload"' pyproject.toml; then
            echo "::error::pyproject.toml still has the 'Private :: Do Not Upload' classifier; remove it to release (PACKAGING.md)."
            exit 1
          fi

      - name: Build
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check --strict dist/*
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/kestrel-explorer
    permissions:
      id-token: write   # trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
